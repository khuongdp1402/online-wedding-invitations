services:
  db:
    image: postgres:16-alpine
    container_name: wedding-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: wedding
      POSTGRES_PASSWORD: wedding_secret
      POSTGRES_DB: wedding_db
    ports:
      - "5433:5432"
    volumes:
      - wedding_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wedding -d wedding_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wedding-app
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://wedding:wedding_secret@db:5432/wedding_db?schema=public"
      PRISMA_USE_DB_PUSH: "true"
      NEXTAUTH_URL: "http://localhost:3001"
      NEXT_PUBLIC_APP_URL: "http://localhost:3001"
      S3_ENDPOINT: "http://minio:9000"
      S3_SIGNING_ENDPOINT: "http://localhost:9010"
      S3_REGION: "us-east-1"
      S3_BUCKET: "wedding-uploads"
      S3_ACCESS_KEY_ID: "minio"
      S3_SECRET_ACCESS_KEY: "minio_secret_change_me"
      S3_PUBLIC_URL: "http://localhost:9010"
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started

  minio:
    image: minio/minio:latest
    container_name: wedding-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio_secret_change_me
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - wedding_minio:/data

  createbuckets:
    image: minio/mc
    container_name: wedding-create-buckets
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 minio minio_secret_change_me) do echo 'Waiting for MinIO...' && sleep 1; done;
      /usr/bin/mc mb --ignore-existing myminio/wedding-uploads;
      /usr/bin/mc anonymous set public myminio/wedding-uploads;
      exit 0;
      "

volumes:
  wedding_pgdata:
  wedding_minio:
